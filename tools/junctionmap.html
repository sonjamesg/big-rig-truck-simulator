<!doctype html>
<!--
  @file map/index.html — junction review map (GENERATED by tools/junctionmap.py from tools/junctionmap.html; do not edit map/index.html).
  Pan / pinch over the real world raster (map/world.png), every junction / roundabout / bend marked with its id, filters,
  step through unsignalised junctions, search, coordinates burned into the view for screenshots. Not indexed.
-->
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04060b">
<title>Big Rig junction map</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#04060b;--p:rgba(8,13,26,.9);--l:#1a2b48;--t:#e6f0ff;--m:#8ea3c4;--n:#38bdf8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:14px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
.pn{position:fixed;background:var(--p);border:1px solid var(--l);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#top{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px}
#top input{flex:1 1 150px;min-width:0;background:#060b16;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px}
button{font:inherit;font-weight:700;color:var(--t);background:#0b1426;border:1px solid var(--l);border-radius:10px;padding:8px 11px;cursor:pointer;white-space:nowrap}
button.on{border-color:var(--n);color:var(--n);box-shadow:0 0 12px rgba(56,189,248,.4)}
#ro{font:700 15px ui-monospace,Menlo,monospace;color:var(--n);text-shadow:0 0 8px rgba(56,189,248,.6);padding:0 4px}
#flt{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#flt button{padding:6px 10px;font-size:13px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#step{left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;padding:8px}
#stepn{font:700 13px ui-monospace,monospace;color:var(--m);min-width:64px;text-align:center}
#info{right:10px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 64px));padding:12px 14px;min-width:200px;display:none}
#info b{font-size:20px;color:var(--n)}#info .r{color:var(--m);font-size:13px;margin-top:4px}#info .r span{color:var(--t);font-weight:700}
#leg{right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:7px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
#msg{left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;display:none}
@media(max-width:640px){body.inf #leg{display:none}#leg{left:10px;right:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px)}#info{left:10px;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 96px)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="top" class="pn">
 <span id="ro">x 0 · y 0</span>
 <input id="q" placeholder="Search J276, R2, C5 or 1200,340" autocomplete="off" enterkeyhint="go">
 <button id="go">Go</button>
 <div id="flt"></div>
</div>
<div id="step" class="pn"><button id="pv">◀</button><span id="stepn">–</span><button id="nx">▶</button><button id="lst">List</button></div>
<div id="leg" class="pn"></div>
<div id="info" class="pn"></div>
<div id="msg" class="pn"></div>
<script>
const D=/*DATA*/null;
const TY={sig:{n:'Signalised',c:'#22c55e'},rb:{n:'Roundabout',c:'#a855f7'},gw:{n:'Unsignalised / give-way',c:'#f97316'},corner:{n:'Corner (2 arms)',c:'#38bdf8'},bend:{n:'Bend (curve)',c:'#94a3b8'}};
const cv=document.getElementById('c'),g=cv.getContext('2d');let DPR=1,VW=0,VH=0;
const V={x:D.W/2,y:D.H/2,s:0.5};let sel=null,show=new Set(Object.keys(TY)),stepT='gw',stepI=-1;
// world raster + "lighten" mipmaps so 1-tile roads survive zooming out
const img=new Image();img.src='world.png';const MIP=[];
img.onload=()=>{MIP.push(img);let src=img;for(let k=1;k<4;k++){const c=document.createElement('canvas');c.width=Math.ceil(src.width/2);c.height=Math.ceil(src.height/2);const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.globalCompositeOperation='lighten';
 for(const[ox,oy]of[[0,0],[-1,0],[0,-1],[-1,-1]])x.drawImage(src,ox,oy,src.width,src.height,0,0,src.width/2,src.height/2);MIP.push(c);src=c}draw()};
function rs(){DPR=Math.min(3,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;draw()}
const w2s=(x,y)=>[(x-V.x)*V.s+VW/2,(y-V.y)*V.s+VH/2],s2w=(x,y)=>[(x-VW/2)/V.s+V.x,(y-VH/2)/V.s+V.y];
let raf=0;function draw(){if(!raf)raf=requestAnimationFrame(paint)}
function paint(){raf=0;g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#04060b';g.fillRect(0,0,VW,VH);
 if(MIP.length){let k=0;while(k<MIP.length-1&&V.s*DPR<0.5/(1<<k)*1)k++;const m=MIP[k],f=1<<k;g.imageSmoothingEnabled=V.s*DPR<1/f;
  const [ax,ay]=w2s(0,0);g.drawImage(m,0,0,m.width,m.height,ax,ay,m.width*f*V.s,m.height*f*V.s)}
 // regions
 g.textAlign='center';g.textBaseline='middle';
 for(const[n,x,y,lv]of D.labels){const[sx,sy]=w2s(x,y);if(sx<-200||sx>VW+200||sy<-50||sy>VH+50)continue;const fs=Math.max(9,Math.min(28,(lv>1?6:9)*Math.sqrt(V.s)*2.4));
  g.font=`800 ${fs}px system-ui,sans-serif`;g.fillStyle='rgba(125,211,252,.55)';g.fillText(String(n).toUpperCase(),sx,sy)}
 // nodes
 const R=Math.max(3,Math.min(9,V.s*1.6)),lab=V.s>=2.2;
 g.font='700 11px ui-monospace,Menlo,monospace';
 for(const o of D.nodes){if(!show.has(o.t))continue;const[sx,sy]=w2s(o.x,o.y);if(sx<-20||sx>VW+20||sy<-20||sy>VH+20)continue;
  if(V.s>=1.5&&o.w){g.strokeStyle=TY[o.t].c+'99';g.lineWidth=1;g.strokeRect(sx-o.w/2*V.s,sy-o.h/2*V.s,o.w*V.s,o.h*V.s)}
  g.beginPath();g.arc(sx,sy,o===sel?R+4:R,0,7);g.fillStyle=TY[o.t].c;g.fill();
  if(o.t==='corner'&&o.L){g.lineWidth=2;g.strokeStyle='#22c55e';g.stroke()}
  if(o===sel){g.lineWidth=2.5;g.strokeStyle='#fff';g.stroke()}
  if(lab||o===sel){const t=o.id;g.lineWidth=3;g.strokeStyle='#04060b';g.strokeText(t,sx,sy-R-8);g.fillStyle='#fff';g.fillText(t,sx,sy-R-8)}}
 // crosshair
 g.strokeStyle='rgba(56,189,248,.9)';g.lineWidth=1.5;g.beginPath();g.moveTo(VW/2-14,VH/2);g.lineTo(VW/2-4,VH/2);g.moveTo(VW/2+4,VH/2);g.lineTo(VW/2+14,VH/2);g.moveTo(VW/2,VH/2-14);g.lineTo(VW/2,VH/2-4);g.moveTo(VW/2,VH/2+4);g.lineTo(VW/2,VH/2+14);g.stroke();
 // coordinate stamp burned into the view (bottom-left, above the step bar on phones)
 const cx=Math.floor(V.x),cy=Math.floor(V.y),txt=`x ${cx}  y ${cy}`+(sel?`   ${sel.id}`:'');
 g.font='800 15px ui-monospace,Menlo,monospace';g.textAlign='left';const tw=g.measureText(txt).width;const by=document.getElementById('top').getBoundingClientRect().bottom+24;
 g.fillStyle='rgba(4,6,11,.85)';g.fillRect(10,by-14,tw+20,28);g.strokeStyle='#38bdf8';g.lineWidth=1;g.strokeRect(10.5,by-13.5,tw+19,27);g.fillStyle='#7dd3fc';g.fillText(txt,20,by+1);
 document.getElementById('ro').textContent=`x ${cx} · y ${cy}`;
 clearTimeout(paint.h);paint.h=setTimeout(()=>history.replaceState(null,'',`#${cx},${cy},${V.s.toFixed(2)}${sel?','+sel.id:''}`),250)}
function clampS(s){return Math.max(Math.min(VW,VH)/D.W*0.8,Math.min(40,s))}
function zoomAt(f,px,py){const[wx,wy]=s2w(px,py);V.s=clampS(V.s*f);V.x=wx-(px-VW/2)/V.s;V.y=wy-(py-VH/2)/V.s;draw()}
// pointers: pan, pinch, tap
const P=new Map();let pd=null,moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=null});
cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=[e.clientX,e.clientY];P.set(e.pointerId,n);
 if(P.size===1){V.x-=(n[0]-o[0])/V.s;V.y-=(n[1]-o[1])/V.s;moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);draw()}
 else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  if(pd){V.x-=(mx-pd.mx)/V.s;V.y-=(my-pd.my)/V.s;zoomAt(d/pd.d,mx,my)}pd={d,mx,my};moved=99}});
const up=e=>{if(P.size===1&&moved<8)tap(e.clientX,e.clientY);P.delete(e.pointerId);pd=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pd=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0025)),e.clientX,e.clientY)},{passive:false});
addEventListener('gesturestart',e=>e.preventDefault());
function tap(x,y){let b=null,bd=22*22;for(const o of D.nodes){if(!show.has(o.t))continue;const[sx,sy]=w2s(o.x,o.y),d=(sx-x)**2+(sy-y)**2;if(d<bd){bd=d;b=o}}select(b,false)}
const ARM={N:'north',S:'south',E:'east',W:'west'};
function select(o,center){sel=o;const el=document.getElementById('info');
 if(!o){el.style.display='none';document.body.classList.remove('inf');draw();return}
 if(center){V.x=o.x;V.y=o.y;if(V.s<3)V.s=4}
 el.innerHTML=`<b>${o.id}</b> <span style="color:${TY[o.t].c};font-weight:800">● ${TY[o.t].n}</span>
 <div class="r">Tile <span>${Math.floor(o.x)}, ${Math.floor(o.y)}</span></div>
 <div class="r">Arms <span>${o.a}</span>${o.s?` (${o.s.split('').map(k=>ARM[k]).join(', ')})`:''}</div>
 ${o.t==='rb'?'':`<div class="r">Traffic lights <span>${o.L?'yes':'no'}</span></div>`}
 ${o.w?`<div class="r">Box <span>${o.w}×${o.h}</span> tiles</div>`:''}${o.k?`<div class="r">Road <span>${o.k}</span></div>`:''}`;
 el.style.display='block';document.body.classList.add('inf');draw()}
// filters + legend
const cnt={};for(const o of D.nodes)cnt[o.t]=(cnt[o.t]||0)+1;
const F=document.getElementById('flt'),mk=(t,h,f)=>{const b=document.createElement('button');b.innerHTML=h;b.onclick=f;F.appendChild(b);return b};
const fb={};const setF=k=>{show=new Set(k==='all'?Object.keys(TY):[k]);for(const x in fb)fb[x].classList.toggle('on',x===k);if(k!=='all'&&k!=='sig'&&k!=='rb')stepT=k;stepI=-1;upStep();draw()};
fb.all=mk('all','All',()=>setF('all'));
for(const k of ['gw','corner','sig','rb','bend'])fb[k]=mk(k,`<span class="sw" style="background:${TY[k].c}"></span>${k==='gw'?'Unsignalised':k==='corner'?'Corners':TY[k].n} ${cnt[k]||0}`,()=>setF(k));
fb.all.classList.add('on');
document.getElementById('leg').innerHTML=Object.entries(TY).map(([k,v])=>`<span><span class="sw" style="background:${v.c}"></span>${v.n}</span>`).join('')+'<span><span class="sw" style="background:#38bdf8;box-shadow:0 0 0 2px #22c55e"></span>Corner with lights</span>';
// step through unsignalised (or corners when that filter is on), ordered north to south, west to east
const L=()=>D.nodes.filter(o=>o.t===stepT).sort((a,b)=>a.y-b.y||a.x-b.x);
function upStep(){const l=L();document.getElementById('stepn').textContent=stepI<0?`${l.length} ${stepT==='gw'?'unsig.':stepT}`:`${stepI+1} / ${l.length}`}
function step(d){const l=L();if(!l.length)return;stepI=(stepI+d+l.length)%l.length;if(!show.has(stepT))setF(stepT==='gw'?'gw':stepT);select(l[stepI],true);upStep()}
document.getElementById('nx').onclick=()=>step(1);document.getElementById('pv').onclick=()=>step(-1);
document.getElementById('lst').onclick=()=>{const m=document.getElementById('msg');if(m.style.display==='block'){m.style.display='none';return}
 const l=L();m.innerHTML=`<div style="max-height:60vh;overflow:auto;min-width:240px">${l.map((o,i)=>`<div data-i="${i}" style="padding:7px 4px;border-bottom:1px solid #1a2b48;cursor:pointer"><b style="color:${TY[o.t].c}">${o.id}</b> <span style="color:#8ea3c4">${Math.floor(o.x)}, ${Math.floor(o.y)} · ${o.a} arms</span></div>`).join('')}</div>`;
 m.style.display='block';m.onclick=e=>{const r=e.target.closest('[data-i]');if(!r)return;stepI=+r.dataset.i-1;m.style.display='none';step(1)}};
// search
function search(){const q=document.getElementById('q').value.trim().toUpperCase();if(!q)return;
 const c=q.match(/^(-?\d+(?:\.\d+)?)[\s,]+(-?\d+(?:\.\d+)?)$/);if(c){V.x=+c[1]+0.5;V.y=+c[2]+0.5;if(V.s<3)V.s=4;select(null);return}
 const id=/^\d+$/.test(q)?'J'+q:q,o=D.nodes.find(n=>n.id===id);if(o){if(!show.has(o.t))setF('all');select(o,true)}else{const m=document.getElementById('msg');m.textContent='Not found: '+q;m.style.display='block';setTimeout(()=>m.style.display='none',1500)}
 document.getElementById('q').blur()}
document.getElementById('go').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
addEventListener('resize',rs);
// #x,y,zoom[,id] deep links
(function(){const h=location.hash.slice(1).split(',');if(h.length>=2&&!isNaN(+h[0])){V.x=+h[0]+.5;V.y=+h[1]+.5;if(h[2])V.s=+h[2];if(h[3]){const o=D.nodes.find(n=>n.id===h[3]);if(o)setTimeout(()=>select(o,false))}}})();
rs();if(!location.hash)V.s=clampS(Math.min(VW,VH)/D.W);upStep();draw();
</script></body></html>
