function zoomAt(f,px,py){const[wx,wy]=s2w(px,py);V.s=clampS(V.s*f);V.x=wx-(px-VW/2)/V.s;V.y=wy-(py-VH/2)/V.s;draw()}
// pointers: pan, pinch, tap
const P=new Map();let pd=null,moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=null});
cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=[e.clientX,e.clientY];P.set(e.pointerId,n);
 if(P.size===1){V.x-=(n[0]-o[0])/V.s;V.y-=(n[1]-o[1])/V.s;moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);draw()}
 else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  if(pd){V.x-=(mx-pd.mx)/V.s;V.y-=(my-pd.my)/V.s;zoomAt(d/pd.d,mx,my)}pd={d,mx,my};moved=99}});
const up=e=>{if(P.size===1&&moved<8)tap(e.clientX,e.clientY);P.delete(e.pointerId);pd=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pd=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0025)),e.clientX,e.clientY)},{passive:false});
addEventListener('gesturestart',e=>e.preventDefault());
function tap(x,y){let b=null,bd=22*22;for(const o of D.nodes){if(!show.has(o.t))continue;const[sx,sy]=w2s(o.x,o.y),d=(sx-x)**2+(sy-y)**2;if(d<bd){bd=d;b=o}}select(b,false)}
const ARM={N:'north',S:'south',E:'east',W:'west'};
function select(o,center){sel=o;const el=document.getElementById('info');
 if(!o){el.style.display='none';document.body.classList.remove('inf');draw();return}
 if(center){V.x=o.x;V.y=o.y;if(V.s<3)V.s=4}
 el.innerHTML=`<b>${o.id}</b> <span style="color:${TY[o.t].c};font-weight:800">● ${TY[o.t].n}</span>
 <div class="r">Tile <span>${Math.floor(o.x)}, ${Math.floor(o.y)}</span></div>
 <div class="r">Arms <span>${o.a}</span>${o.s?` (${o.s.split('').map(k=>ARM[k]).join(', ')})`:''}</div>
 ${o.t==='rb'?'':`<div class="r">Traffic lights <span>${o.L?'yes':'no'}</span></div>`}
 ${o.w?`<div class="r">Box <span>${o.w}×${o.h}</span> tiles</div>`:''}${o.k?`<div class="r">Road <span>${o.k}</span></div>`:''}`;
 el.style.display='block';document.body.classList.add('inf');draw()}
// filters + legend
const cnt={};for(const o of D.nodes)cnt[o.t]=(cnt[o.t]||0)+1;
const F=document.getElementById('flt'),mk=(t,h,f)=>{const b=document.createElement('button');b.innerHTML=h;b.onclick=f;F.appendChild(b);return b};
const fb={};const setF=k=>{show=new Set(k==='all'?Object.keys(TY):[k]);for(const x in fb)fb[x].classList.toggle('on',x===k);if(k!=='all'&&k!=='sig'&&k!=='rb')stepT=k;stepI=-1;upStep();draw()};
fb.all=mk('all','All',()=>setF('all'));
for(const k of ['gw','corner','sig','rb','bend'])fb[k]=mk(k,`<span class="sw" style="background:${TY[k].c}"></span>${k==='gw'?'Unsignalised':k==='corner'?'Corners':TY[k].n} ${cnt[k]||0}`,()=>setF(k));
fb.all.classList.add('on');
document.getElementById('leg').innerHTML=Object.entries(TY).map(([k,v])=>`<span><span class="sw" style="background:${v.c}"></span>${v.n}</span>`).join('')+'<span><span class="sw" style="background:#38bdf8;box-shadow:0 0 0 2px #22c55e"></span>Corner with lights</span>';
// step through unsignalised (or corners when that filter is on), ordered north to south, west to east
const L=()=>D.nodes.filter(o=>o.t===stepT).sort((a,b)=>a.y-b.y||a.x-b.x);
function upStep(){const l=L();document.getElementById('stepn').textContent=stepI<0?`${l.length} ${stepT==='gw'?'unsig.':stepT}`:`${stepI+1} / ${l.length}`}
function step(d){const l=L();if(!l.length)return;stepI=(stepI+d+l.length)%l.length;if(!show.has(stepT))setF(stepT==='gw'?'gw':stepT);select(l[stepI],true);upStep()}
document.getElementById('nx').onclick=()=>step(1);document.getElementById('pv').onclick=()=>step(-1);
document.getElementById('lst').onclick=()=>{const m=document.getElementById('msg');if(m.style.display==='block'){m.style.display='none';return}
 const l=L();m.innerHTML=`<div style="max-height:60vh;overflow:auto;min-width:240px">${l.map((o,i)=>`<div data-i="${i}" style="padding:7px 4px;border-bottom:1px solid #1a2b48;cursor:pointer"><b style="color:${TY[o.t].c}">${o.id}</b> <span style="color:#8ea3c4">${Math.floor(o.x)}, ${Math.floor(o.y)} · ${o.a} arms</span></div>`).join('')}</div>`;
 m.style.display='block';m.onclick=e=>{const r=e.target.closest('[data-i]');if(!r)return;stepI=+r.dataset.i-1;m.style.display='none';step(1)}};
// search
function search(){const q=document.getElementById('q').value.trim().toUpperCase();if(!q)return;
 const c=q.match(/^(-?\d+(?:\.\d+)?)[\s,]+(-?\d+(?:\.\d+)?)$/);if(c){V.x=+c[1]+0.5;V.y=+c[2]+0.5;if(V.s<3)V.s=4;select(null);return}
 const id=/^\d+$/.test(q)?'J'+q:q,o=D.nodes.find(n=>n.id===id);if(o){if(!show.has(o.t))setF('all');select(o,true)}else{const m=document.getElementById('msg');m.textContent='Not found: '+q;m.style.display='block';setTimeout(()=>m.style.display='none',1500)}
 document.getElementById('q').blur()}
document.getElementById('go').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
addEventListener('resize',rs);
// #x,y,zoom[,id] deep links
(function(){const h=location.hash.slice(1).split(',');if(h.length>=2&&!isNaN(+h[0])){V.x=+h[0]+.5;V.y=+h[1]+.5;if(h[2])V.s=+h[2];if(h[3]){const o=D.nodes.find(n=>n.id===h[3]);if(o)setTimeout(()=>select(o,false))}}})();
rs();if(!location.hash)V.s=clampS(Math.min(VW,VH)/D.W);upStep();draw();
</script></body></html>
